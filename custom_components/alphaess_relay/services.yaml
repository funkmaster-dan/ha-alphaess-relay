stop:
  name: Stop charge or discharge
  description: Return the supported mode-2 dispatch to normal operation and verify device readback. This does not claim to cancel unrelated control modes.
  fields:
    entry_id:
      name: Integration
      selector:
        config_entry:
          integration: alphaess_relay
